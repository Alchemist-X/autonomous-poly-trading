services:
  raven:
    build:
      context: ../..
      dockerfile: deploy/raven/Dockerfile
    # Shared image: forecast-api runs the same build with a different command,
    # so the workspace is only built once.
    image: raven-suite
    restart: unless-stopped
    # Bind to localhost only — TLS + hostname routing belong to the reverse
    # proxy (see Caddyfile.example).
    ports:
      - "127.0.0.1:3200:3200"
    env_file: .env
    volumes:
      # Forecast dossiers + analyst annotations (the product's data).
      - raven-artifacts:/app/runtime-artifacts
      # claude CLI state (kept across restarts; harmless if unused).
      - claude-config:/root/.claude
    mem_limit: 2g

  # Forecast API + MCP: POST a question, get probability + reasoning +
  # evidence back as JSON / plain text / PDF. Shares the artifacts volume, so
  # API-created forecasts also show up in the raven web app (and vice versa).
  forecast-api:
    image: raven-suite
    depends_on:
      - raven
    restart: unless-stopped
    command: ["pnpm", "--filter", "@autopoly/forecast-api", "start"]
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    volumes:
      - raven-artifacts:/app/runtime-artifacts
      - claude-config:/root/.claude
    # Engine children (tsx + claude CLI) plus a serialized Chromium PDF render
    # share this cgroup; 4g keeps two concurrent runs + one render safe.
    mem_limit: 4g

  # Autonomous PAPER trading agent (simulated fills only — no keys, no signer,
  # no order endpoints). Evaluates positions 3×/day through isolated DeepSeek/
  # Kimi engine runs; shares the artifacts volume so its forecast dossiers are
  # also visible in the raven app.
  paper-agent:
    image: raven-suite
    depends_on:
      - raven
    restart: unless-stopped
    command: ["pnpm", "--filter", "@autopoly/paper-agent", "start"]
    env_file: .env
    volumes:
      - raven-artifacts:/app/runtime-artifacts
      # claude CLI state — the evaluator can run the claude provider too.
      - claude-config:/root/.claude
    mem_limit: 2g

  # Raven Delta — news -> US-stock impact engine (standalone site, port 3300).
  # Gate the instance with DELTA_ACCESS_TOKEN; the analysis engine follows
  # DELTA_PROVIDER/DELTA_CLAUDE_CLI (the claude CLI + oauth token are already
  # in this image/env for the other services).
  raven-delta:
    image: raven-suite
    depends_on:
      - raven
    restart: unless-stopped
    command: ["pnpm", "--filter", "@autopoly/raven-delta", "start"]
    ports:
      - "127.0.0.1:3300:3300"
    env_file: .env
    volumes:
      - raven-artifacts:/app/runtime-artifacts
      - claude-config:/root/.claude
    mem_limit: 2g

  # Raven Delta WebSocket hub: dashboards subscribe here; the app POSTs run
  # digests to /broadcast (write side gated by DELTA_WS_TOKEN).
  delta-ws:
    image: raven-suite
    depends_on:
      - raven
    restart: unless-stopped
    command: ["pnpm", "delta:ws"]
    environment:
      # Bind beyond loopback inside the container so the published port works.
      DELTA_WS_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8791:8791"
    env_file: .env
    mem_limit: 512m

  # Delta PM — news-driven US-equity paper agent (Phase 0 SHADOW mode: no
  # keys, no signer; market data read-only from Hyperliquid public info API;
  # The Information feed via curl). Status/ingest API on 8792.
  delta-pm:
    image: raven-suite
    depends_on:
      - raven
    restart: unless-stopped
    command: ["pnpm", "--filter", "@autopoly/delta-pm", "start"]
    ports:
      - "127.0.0.1:8792:8792"
    env_file: .env
    volumes:
      - raven-artifacts:/app/runtime-artifacts
      - claude-config:/root/.claude
    mem_limit: 2g

  # Delta PM operator console (positions + live analysis progress, :3400).
  delta-pm-console:
    image: raven-suite
    depends_on:
      - delta-pm
    restart: unless-stopped
    command: ["pnpm", "--filter", "@autopoly/delta-pm-console", "start"]
    environment:
      DELTAPM_STATUS_URL: http://delta-pm:8792
    ports:
      - "127.0.0.1:3400:3400"
    env_file: .env
    mem_limit: 1g

volumes:
  raven-artifacts:
  claude-config:
